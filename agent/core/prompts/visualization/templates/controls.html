## Template: controls
```html
<section id="capacity" class="lv-panel lv-stack">
  <label class="lv-label">Workers <input class="lv-input" name="workers" type="number" min="1" max="20" value="4"></label>
  <label class="lv-row"><input class="lv-toggle" name="boost" type="checkbox" role="switch"> Enable 25% boost</label>
  <output class="lv-value" aria-live="polite"></output>
  <div><button class="lv-button" type="button">Reset</button> <span class="lv-pill">Illustrative</span></div>
</section>
<script>
(() => {
  const root = document.getElementById('capacity');
  const workers = root.querySelector('[name="workers"]');
  const boost = root.querySelector('[name="boost"]');
  const update = () => {
    if (!workers.checkValidity()) { root.querySelector('output').textContent = 'Enter 1–20 workers'; return; }
    root.querySelector('output').textContent = `${Number(workers.value) * 100 * (boost.checked ? 1.25 : 1)} items/hour`;
  };
  root.addEventListener('input', update);
  root.querySelector('button').addEventListener('click', () => { workers.value = 4; boost.checked = false; update(); });
  update();
})();
</script>
```
