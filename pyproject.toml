[project]
name = "research-agent"
version = "0.1.0"
description = "research-agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-text-splitters>=0.3.8,<0.4.0",
    "openai>=2.30.0,<2.31.0",
    "rich>=13.9.4,<14.0.0",
    "structlog>=25.4.0,<26.0.0",
    "pip>=25.1,<26.0",
    "pydantic>=2.11.4,<2.12.0",
    "pydantic-settings>=2.9.1,<2.10.0",
    "pymilvus[milvus-lite]>=2.6.0,<2.6.15",
    "protobuf>=5.27.2,<6.0.0",
    "pymupdf>=1.25.5,<1.26.0",
    "tenacity>=9.1.2,<9.2.0",
    "anthropic>=0.79.0,<0.80",
    "pandas>=2.2.3,<3.0.0",
    "fastapi>=0.117.0,<0.140.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "sse-starlette>=2.2.0,<3.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "sqlalchemy[asyncio]>=2.0.40,<2.1.0",
    "aiosqlite>=0.21.0,<0.22.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "cachetools>=5.5.0,<6.0.0",
    "httpx>=0.28.0,<0.29.0",
    "arize-phoenix>=13.18.2",
    "arize-phoenix-client>=2.11.0",
    "arize-phoenix-evals>=2.12.0,<3.0.0",
    "arize-phoenix-otel>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "evaluation"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<0.26.0",
    "httpx>=0.28.0,<0.29.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["agent", "evaluation", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true  # for strict mypy: (this is the tricky one :-))
disallow_untyped_calls = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
